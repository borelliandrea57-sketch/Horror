name: Compila La Terza Campana v10.9 Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-v109.yml'
permissions:
  contents: write
concurrency:
  group: build-windows-v109
  cancel-in-progress: false
jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE: game/La_Terza_Campana_CSharp_v10_8
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - name: Verifica codice Core
        run: |
          dotnet run --project "$env:SOURCE/CoreTests/LaTerzaCampana.CoreTests.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Core tests falliti" }
      - name: Scarica Godot .NET e template ufficiali
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot-builds/releases/download/$v-stable"
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $editorZip = Join-Path $dir 'editor.zip'
          $templatesZip = Join-Path $dir 'templates.zip'
          curl.exe --fail --location --retry 3 "$base/Godot_v$v-stable_mono_win64.zip" --output $editorZip
          if ($LASTEXITCODE -ne 0) { throw "Download editor fallito" }
          curl.exe --fail --location --retry 3 "$base/Godot_v$v-stable_mono_export_templates.tpz" --output $templatesZip
          if ($LASTEXITCODE -ne 0) { throw "Download template fallito" }
          Expand-Archive -LiteralPath $editorZip -DestinationPath "$dir/editor"
          $exe = Get-ChildItem "$dir/editor" -Recurse -File -Filter '*_console.exe' | Select-Object -First 1
          if (-not $exe) { throw "Editor console non trovato" }
          Expand-Archive -LiteralPath $templatesZip -DestinationPath "$dir/tpz"
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$v.stable.mono"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$dir/tpz/templates/*" $templateDir -Recurse -Force
          if (-not (Test-Path "$templateDir/windows_release_x86_64.exe")) { throw "Template Windows non trovato" }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Importa risorse e compila C#
        run: |
          $p = (Resolve-Path "$env:SOURCE/GodotProject").Path
          & $env:GODOT_EXE --version
          if ($LASTEXITCODE -ne 0) { throw "Godot non funzionante" }
          & $env:GODOT_EXE --headless --path $p --editor --import
          if ($LASTEXITCODE -ne 0) { throw "Import Godot fallito" }
          dotnet build "$p/LaTerzaCampana.csproj" --configuration Debug
          if ($LASTEXITCODE -ne 0) { throw "Build C# fallita" }
      - name: Esporta Windows x64
        run: |
          $p = (Resolve-Path "$env:SOURCE/GodotProject").Path
          $out = Join-Path $env:RUNNER_TEMP 'La_Terza_Campana_v10_9'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $env:GODOT_EXE --headless --path $p --export-release 'Windows Desktop' "$out/LaTerzaCampana.exe"
          if ($LASTEXITCODE -ne 0) { throw "Export fallito" }
          if (-not (Test-Path "$out/LaTerzaCampana.exe") -or -not (Test-Path "$out/LaTerzaCampana.pck")) { throw "Output incompleto" }
          if (-not (Get-ChildItem $out -Recurse -Filter 'LaTerzaCampana.dll')) { throw "Assembly gioco mancante" }
          $assets = Join-Path $out 'v8_assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          Get-ChildItem "$p/Assets" -File | Where-Object { $_.Extension -in '.png','.jpg','.wav' } | Copy-Item -Destination $assets
          $zip = Join-Path $env:GITHUB_WORKSPACE 'La_Terza_Campana_Godot_CSharp_v10_9_Windows_x64.zip'
          Compress-Archive -LiteralPath $out -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: La_Terza_Campana_v10_9_Windows_x64
          path: La_Terza_Campana_Godot_CSharp_v10_9_Windows_x64.zip
          if-no-files-found: error
      - name: Pubblica versione compilata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.9 'La_Terza_Campana_Godot_CSharp_v10_9_Windows_x64.zip' --target "$env:GITHUB_SHA" --title 'La Terza Campana v10.9' --notes 'Pre-prologo di Anatema aggiornato e statistiche nascoste durante la selezione. Test Core superati. Export Windows x64.'
          if ($LASTEXITCODE -ne 0) { throw "Pubblicazione release fallita; ZIP disponibile negli artifact della build." }
